<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Separate guest and checkout access</title><desc id="desc">A firewall restricts traffic between network zones. Guest devices do not gain access to checkout systems by joining the shop network.</desc><rect width="900" height="300" rx="18" fill="#edf1e5"/><g font-family="Arial,sans-serif" fill="#173b3b" text-anchor="middle"><rect x="30" y="45" width="220" height="160" rx="12" fill="#fffefa" stroke="#174f4a" stroke-width="3"/><text x="140" y="112" font-size="24" font-weight="bold">Guest Wi-Fi</text><text x="140" y="147" font-size="18">Untrusted devices</text><rect x="353" y="45" width="190" height="160" rx="12" fill="#d8b27c"/><text x="448" y="112" font-size="24" font-weight="bold">Firewall</text><text x="448" y="147" font-size="18">Enforce policy</text><rect x="648" y="45" width="220" height="160" rx="12" fill="#fffefa" stroke="#174f4a" stroke-width="3"/><text x="758" y="112" font-size="24" font-weight="bold">Checkout zone</text><text x="758" y="147" font-size="18">Restricted services</text><path d="M260 126h81m214 0h81" stroke="#174f4a" stroke-width="4"/><g stroke="#a33f28" stroke-width="6"><path d="M578 104l40 44m0-44-40 44"/></g><text x="450" y="257" font-size="20" font-weight="bold">Allow documented flows. Deny unnecessary access.</text></g></svg>
