<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Identity, rights and evidence</title><desc id="desc">Authentication checks identity, authorization checks allowed actions, and accounting records activity.</desc><rect width="900" height="300" rx="18" fill="#edf1e5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#173b3b"><g fill="#fffefa" stroke="#174f4a" stroke-width="2"><rect x="25" y="35" width="265" height="230" rx="14"/><rect x="318" y="35" width="265" height="230" rx="14"/><rect x="610" y="35" width="265" height="230" rx="14"/></g><g fill="#d8b27c"><circle cx="157" cy="88" r="25"/><circle cx="450" cy="88" r="25"/><circle cx="742" cy="88" r="25"/></g><g font-size="22" font-weight="bold"><text x="157" y="96">1</text><text x="450" y="96">2</text><text x="742" y="96">3</text><text x="157" y="145">Authentication</text><text x="450" y="145">Authorization</text><text x="742" y="145">Accounting</text></g><g font-size="18"><text x="157" y="182">Who is signing in?</text><text x="450" y="182">What may they do?</text><text x="742" y="182">What happened?</text><text x="157" y="224">Verify the identity</text><text x="450" y="224">Limit access to the task</text><text x="742" y="224">Record useful evidence</text></g></g></svg>
