<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Upload and download at BrewByte</title><desc id="desc">Data travels from the shop to the cloud for an upload and from the cloud to the shop for a download.</desc><rect width="900" height="300" rx="18" fill="#edf1e5"/><g font-family="Arial,sans-serif" fill="#173b3b"><rect x="45" y="70" width="225" height="150" rx="12" fill="#fffefa" stroke="#174f4a" stroke-width="3"/><rect x="72" y="94" width="171" height="90" rx="5" fill="#b6d1bc"/><text x="157" y="147" text-anchor="middle" font-size="23" font-weight="bold">BREWBYTE</text><path d="M615 174c-35-6-43-62-8-78 8-60 102-67 125-16 54-11 92 77 31 98z" fill="#d8b27c" stroke="#174f4a" stroke-width="3"/><text x="695" y="139" text-anchor="middle" font-size="23" font-weight="bold">CLOUD</text><path d="M295 104h269m-20-17 20 17-20 17" stroke="#a9571e" stroke-width="7" fill="none"/><text x="430" y="75" text-anchor="middle" font-size="21" font-weight="bold">UPLOAD · SEND</text><path d="M564 201H295m20-17-20 17 20 17" stroke="#174f4a" stroke-width="7" fill="none"/><text x="430" y="249" text-anchor="middle" font-size="21" font-weight="bold">DOWNLOAD · RECEIVE</text><text x="450" y="151" text-anchor="middle" font-size="17">Choose the rate for the task.</text></g></svg>
