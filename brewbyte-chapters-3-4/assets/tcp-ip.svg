<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">An HTTPS request using TCP/IP</title><desc id="desc">A client browser exchanges packets through routers with a server. IP supports addressing and routing, TCP reliable ordered transport, and TLS connection protection.</desc><rect width="900" height="300" rx="18" fill="#edf1e5"/><g font-family="Arial,sans-serif" fill="#173b3b"><rect x="28" y="40" width="215" height="115" rx="12" fill="#fffefa" stroke="#174f4a" stroke-width="3"/><text x="135" y="88" text-anchor="middle" font-size="22" font-weight="bold">Customer browser</text><text x="135" y="119" text-anchor="middle" font-size="17">Client requests menu</text><rect x="350" y="54" width="190" height="88" rx="40" fill="#d8b27c"/><text x="445" y="106" text-anchor="middle" font-size="22" font-weight="bold">Routers</text><rect x="648" y="40" width="224" height="115" rx="12" fill="#fffefa" stroke="#174f4a" stroke-width="3"/><text x="760" y="88" text-anchor="middle" font-size="22" font-weight="bold">BrewByte server</text><text x="760" y="119" text-anchor="middle" font-size="17">Returns menu resources</text><g stroke="#174f4a" stroke-width="4" fill="none"><path d="M250 97h90m-14-12 14 12-14 12M549 97h90m-14-12 14 12-14 12"/></g><text x="65" y="211" font-size="21" font-weight="bold">IP</text><text x="65" y="243" font-size="17">Address and route</text><text x="350" y="211" font-size="21" font-weight="bold">TCP</text><text x="350" y="243" font-size="17">Reliable, ordered delivery</text><text x="665" y="211" font-size="21" font-weight="bold">TLS</text><text x="665" y="243" font-size="17">Protect the connection</text></g></svg>
