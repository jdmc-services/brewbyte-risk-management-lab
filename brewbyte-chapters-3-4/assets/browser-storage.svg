<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Browser storage has different jobs</title><desc id="desc">Cache holds reusable resources, cookies hold site-related state, and history lists visited pages. Clearing them can have different consequences.</desc><rect width="900" height="300" rx="18" fill="#edf1e5"/><g font-family="Arial,sans-serif" fill="#173b3b" text-anchor="middle"><text x="450" y="43" font-size="23" font-weight="bold">Choose a targeted action.</text><g fill="#fffefa" stroke="#174f4a" stroke-width="2"><rect x="30" y="70" width="260" height="185" rx="12"/><rect x="320" y="70" width="260" height="185" rx="12"/><rect x="610" y="70" width="260" height="185" rx="12"/></g><g font-size="24" font-weight="bold"><text x="160" y="117">Cache</text><text x="450" y="117">Cookies</text><text x="740" y="117">History</text></g><g font-size="18"><text x="160" y="158">Reusable page resources</text><text x="450" y="158">Site-related state</text><text x="740" y="158">Visited page records</text><text x="160" y="203">A saved menu image</text><text x="450" y="203">A sign-in session</text><text x="740" y="203">A browsing trail</text></g></g></svg>
